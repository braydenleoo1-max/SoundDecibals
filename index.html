<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study sound meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f6ff;--mute:rgba(235,240,255,.62);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#070a18;min-height:100vh;padding:28px 16px 40px;display:flex;justify-content:center;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;animation:drift 26s ease-in-out infinite alternate}
.o1{width:480px;height:480px;background:#4f5bff;top:-140px;left:-120px}
.o2{width:420px;height:420px;background:#14b8a6;bottom:-120px;right:-100px;animation-delay:-9s}
.o3{width:320px;height:320px;background:#a855f7;top:38%;left:55%;opacity:.35;animation-delay:-17s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.12)}}
main{position:relative;z-index:1;width:100%;max-width:560px;display:grid;gap:18px;align-content:start}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.05);padding:22px}
#card{--zc:#a5b4fc}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h2{font-size:1rem;font-weight:500;color:var(--mute)}
.pill{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.pill i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.pill.on i{background:#5eead4;box-shadow:0 0 10px #5eead4}
.status{font-size:clamp(1.6rem,6.4vw,2.2rem);font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.3}
.status span{padding:0 .2em;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--zc) 45%,transparent) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .5s}
.gauge{position:relative;width:min(100%,290px);margin:10px auto 0;aspect-ratio:1}
.gauge svg{width:100%;height:100%;display:block}
.track,.arc{fill:none;stroke-width:14;stroke-linecap:round}
.track{stroke:rgba(255,255,255,.1);stroke-dasharray:471.24 628.32}
.arc{stroke:var(--zc);stroke-dasharray:.1 628.32;transition:stroke .5s;filter:drop-shadow(0 0 7px var(--zc))}
.ends{fill:rgba(235,240,255,.4);font-size:11px;font-family:inherit;text-anchor:middle}
.read{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding-bottom:6px}
.num{font-size:clamp(3.6rem,16vw,4.6rem);font-weight:500;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.unit{color:var(--mute);margin-top:4px}
.tip{text-align:center;color:var(--mute);min-height:2.7em;margin:4px auto 14px;max-width:34ch;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:7px;font-size:.82rem;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mute);opacity:.6;transition:all .4s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip small{font-size:.74rem;opacity:.7}
.chip.on{opacity:1;color:#fff;background:color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 65%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}
.row{display:flex;gap:12px}
.btn{flex:1;font:inherit;font-weight:500;font-size:1rem;color:#fff;padding:14px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,background .25s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1.6;background:linear-gradient(135deg,rgba(110,130,255,.6),rgba(45,212,191,.5));border-color:rgba(255,255,255,.28)}
.btn.primary:hover{background:linear-gradient(135deg,rgba(130,150,255,.72),rgba(45,212,191,.62))}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stat small{display:block;color:var(--mute);font-size:.78rem;margin-bottom:3px}
.stat b{font-weight:500;font-size:1.15rem;font-variant-numeric:tabular-nums}
.cal{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cal button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:1rem;line-height:1;cursor:pointer}
.cal button:hover{background:rgba(255,255,255,.2)}
.cal b{font-size:.95rem}
.err{color:#fda4af;font-size:.88rem;text-align:center;min-height:1.2em;margin-top:10px}
.note{color:var(--mute);font-size:.78rem;text-align:center;margin-top:6px;opacity:.8}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.gh h2{font-size:1rem;font-weight:500}
.gh span{color:var(--mute);font-size:.82rem}
canvas{display:block;width:100%;height:190px}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main>
  <section class="glass" id="card" aria-label="Sound level meter">
    <div class="top">
      <h2>Study sound meter</h2>
      <div class="pill" id="live"><i></i><span id="livetxt">Not listening</span></div>
    </div>
    <h1 class="status" aria-live="polite"><span id="stxt">Ready to listen</span></h1>
    <div class="gauge">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="track" cx="120" cy="120" r="100" transform="rotate(135 120 120)"/>
        <circle class="arc" id="arc" cx="120" cy="120" r="100" transform="rotate(135 120 120)"/>
        <text class="ends" x="49" y="216">20</text>
        <text class="ends" x="191" y="216">100</text>
      </svg>
      <div class="read"><div class="num" id="num">--</div><div class="unit">dB</div></div>
    </div>
    <p class="tip" id="tip">Tap Start and allow microphone access.</p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn primary" id="toggle">Start</button>
      <button class="btn" id="reset">Reset</button>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="stats">
      <div class="stat"><small>Average</small><b id="avg">--</b></div>
      <div class="stat"><small>Peak</small><b id="peak">--</b></div>
      <div class="stat"><small>Calibration</small>
        <div class="cal"><button id="dn" aria-label="Lower calibration by 1 dB">−</button><b id="off">0</b><button id="up" aria-label="Raise calibration by 1 dB">+</button></div>
      </div>
    </div>
    <p class="note">Readings are estimates. Nudge calibration until it matches a sound meter.</p>
  </section>

  <section class="glass" aria-label="Live sound graph">
    <div class="gh"><h2>Live sound level</h2><span>Last 60 seconds</span></div>
    <canvas id="cv"></canvas>
  </section>
</main>

<script>
(()=>{
const BASE=100,MIN=20,MAXDB=100,ARC=471.24,KEEP=600;
const ZONES=[
 {max:35,name:"Deep focus",range:"under 35",tip:"Silent enough for exams and heavy reading.",c:"#7dd3fc"},
 {max:50,name:"Perfect study session",range:"35–50",tip:"Calm and steady. This is the sweet spot for concentrating.",c:"#5eead4"},
 {max:60,name:"Light study only",range:"50–60",tip:"Fine for notes and review, but hard topics will suffer.",c:"#fde047"},
 {max:70,name:"Getting noisy",range:"60–70",tip:"Focus starts to slip. Try a quieter spot.",c:"#fdba74"},
 {max:Infinity,name:"DON’T study",range:"70+",tip:"Too loud to concentrate. Move somewhere quieter.",c:"#fb7185"}
];
const $=id=>document.getElementById(id);
const el={card:$("card"),num:$("num"),arc:$("arc"),stxt:$("stxt"),tip:$("tip"),chips:$("chips"),toggle:$("toggle"),reset:$("reset"),avg:$("avg"),peak:$("peak"),off:$("off"),cv:$("cv"),err:$("err"),live:$("live"),livetxt:$("livetxt")};
let ctx=null,stream=null,analyser=null,buf=null,running=false;
let offset=0;try{offset=parseInt(localStorage.getItem("dbOffset"),10)||0}catch(e){}
let level=null,disp=null,zi=null,hist=[],sum=0,cnt=0,peak=null,lastSample=0;

ZONES.forEach(z=>{const s=document.createElement("span");s.className="chip";s.style.setProperty("--c",z.c);s.innerHTML="<i></i>"+z.name+" <small>"+z.range+"</small>";el.chips.appendChild(s)});

function fmtOff(){el.off.textContent=(offset>0?"+":offset<0?"−":"")+Math.abs(offset)}
function setIdle(){zi=null;el.card.style.setProperty("--zc","#a5b4fc");el.stxt.textContent="Ready to listen";el.tip.textContent="Tap Start and allow microphone access.";[...el.chips.children].forEach(c=>c.classList.remove("on"));el.num.textContent="--";el.arc.style.strokeDasharray=".1 628.32"}
function setZone(i){zi=i;const z=ZONES[i];el.card.style.setProperty("--zc",z.c);el.stxt.textContent=z.name;el.tip.textContent=z.tip;[...el.chips.children].forEach((c,k)=>c.classList.toggle("on",k===i))}
function pickZone(v){let i=ZONES.findIndex(z=>v<z.max);if(i<0)i=ZONES.length-1;
 if(zi!==null&&Math.abs(i-zi)===1){const edge=i>zi?ZONES[zi].max:ZONES[i].max;if(Math.abs(v-edge)<1.5)return zi}
 return i}
function updateStats(){el.avg.textContent=cnt?Math.round(sum/cnt)+" dB":"--";el.peak.textContent=peak===null?"--":Math.round(peak)+" dB"}
function err(m){el.err.textContent=m}

async function start(){
  err("");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err("This browser can’t access a microphone. Try Chrome, Edge, Safari or Firefox.");return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){
    const framed=window.self!==window.top;
    err(e.name==="NotFoundError"?"No microphone was found. Plug one in or check your device’s sound settings."
      :framed?"This preview doesn’t allow microphone access. Download the file and open it directly in your browser."
      :"Microphone access is blocked. Click the lock icon in the address bar, set Microphone to Allow, then reload the page.");
    return}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended")await ctx.resume();
  analyser=ctx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0;
  ctx.createMediaStreamSource(stream).connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  running=true;el.toggle.textContent="Pause";el.live.classList.add("on");el.livetxt.textContent="Listening";
}
function pause(){
  running=false;if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();
  stream=null;ctx=null;el.toggle.textContent="Resume";el.live.classList.remove("on");el.livetxt.textContent="Paused";
}
function reset(){
  hist=[];sum=0;cnt=0;peak=null;level=null;disp=null;updateStats();err("");
  if(!running){setIdle();el.toggle.textContent="Start";el.livetxt.textContent="Not listening"}
}

el.toggle.onclick=()=>running?pause():start();
el.reset.onclick=reset;
function bump(d){offset=Math.max(-40,Math.min(40,offset+d));fmtOff();try{localStorage.setItem("dbOffset",offset)}catch(e){}}
$("up").onclick=()=>bump(1);$("dn").onclick=()=>bump(-1);
fmtOff();

const g=el.cv.getContext("2d");
function drawGraph(){
  const dpr=window.devicePixelRatio||1,w=el.cv.clientWidth,h=el.cv.clientHeight;
  if(el.cv.width!==Math.round(w*dpr)||el.cv.height!==Math.round(h*dpr)){el.cv.width=Math.round(w*dpr);el.cv.height=Math.round(h*dpr)}
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const L=30,R=6,T=8,B=8,pw=w-L-R,ph=h-T-B;
  const y=v=>T+ph*(1-(Math.min(MAXDB,Math.max(MIN,v))-MIN)/(MAXDB-MIN));
  g.fillStyle="rgba(94,234,212,.09)";g.fillRect(L,y(50),pw,y(35)-y(50));
  g.fillStyle="rgba(251,113,133,.09)";g.fillRect(L,y(MAXDB),pw,y(70)-y(MAXDB));
  g.font="11px Outfit,system-ui,sans-serif";g.textBaseline="middle";g.textAlign="right";
  [30,50,70,90].forEach(v=>{g.strokeStyle="rgba(255,255,255,.09)";g.lineWidth=1;g.beginPath();g.moveTo(L,y(v));g.lineTo(w-R,y(v));g.stroke();g.fillStyle="rgba(235,240,255,.45)";g.fillText(v,L-8,y(v))});
  const n=hist.length;
  if(n<2){g.textAlign="center";g.fillStyle="rgba(235,240,255,.5)";g.font="14px Outfit,system-ui,sans-serif";g.fillText(running?"Listening…":"Press Start to see your sound levels live",L+pw/2,T+ph/2);return}
  const step=pw/(KEEP-1),X=i=>L+pw-(n-1-i)*step;
  const gr=g.createLinearGradient(0,T,0,T+ph);
  [[0,"#fb7185"],[.375,"#fb7185"],[.475,"#fdba74"],[.5625,"#fde047"],[.6875,"#5eead4"],[.875,"#7dd3fc"],[1,"#7dd3fc"]].forEach(s=>gr.addColorStop(s[0],s[1]));
  g.beginPath();g.moveTo(X(0),y(hist[0]));
  for(let i=1;i<n;i++)g.lineTo(X(i),y(hist[i]));
  g.lineTo(X(n-1),T+ph);g.lineTo(X(0),T+ph);g.closePath();
  g.globalAlpha=.16;g.fillStyle=gr;g.fill();g.globalAlpha=1;
  g.beginPath();g.moveTo(X(0),y(hist[0]));
  for(let i=1;i<n;i++)g.lineTo(X(i),y(hist[i]));
  g.lineWidth=2.5;g.lineJoin="round";g.lineCap="round";g.strokeStyle=gr;
  g.shadowBlur=10;g.shadowColor=zi!==null?ZONES[zi].c:"#a5b4fc";g.stroke();g.shadowBlur=0;
  g.beginPath();g.arc(X(n-1),y(hist[n-1]),4,0,Math.PI*2);g.fillStyle="#fff";g.fill();
}

function frame(t){
  if(running){
    analyser.getFloatTimeDomainData(buf);
    let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
    const rms=Math.sqrt(s/buf.length);
    const db=Math.min(120,Math.max(0,20*Math.log10(Math.max(rms,1e-7))+BASE+offset));
    level=level===null?db:level+(db-level)*(db>level?.3:.06);
    if(t-lastSample>=100){lastSample=t;hist.push(level);if(hist.length>KEEP)hist.shift();sum+=level;cnt++;peak=peak===null?level:Math.max(peak,level);updateStats()}
  }
  if(level!==null){
    disp=disp===null?level:disp+(level-disp)*.15;
    const v=Math.max(0,disp),f=Math.min(1,Math.max(0,(v-MIN)/(MAXDB-MIN)));
    el.num.textContent=Math.round(v);
    el.arc.style.strokeDasharray=Math.max(f*ARC,.1)+" 628.32";
    const i=pickZone(v);if(i!==zi)setZone(i);
  }
  drawGraph();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
